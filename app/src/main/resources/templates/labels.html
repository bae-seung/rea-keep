<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>REA 메모</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/app.js}"></script></head><body><header><a href="/" class="brand"><span class="logo">▤</span> REA 메모</a><span>나의 생각을 모으는 공간</span></header><main><nav><a href="/">전체 메모</a><a href="/archive">보관함</a><a href="/trash">휴지통</a></nav><h1>라벨 관리</h1><section class="editor"><form method="post" action="/labels"><label for="name">새 라벨 이름</label><input id="name" name="name" required maxlength="50"><button type="submit">라벨 만들기</button></form><p th:if="${#lists.isEmpty(availableLabels)}">등록된 라벨이 없습니다.</p><article th:each="label : ${availableLabels}"><a th:href="@{/labels/{id}(id=${label.id})}" th:text="${label.name}"></a><form method="post" th:action="@{/labels/{id}/rename(id=${label.id})}"><input name="name" th:value="${label.name}" aria-label="변경할 라벨 이름" required maxlength="50"><button type="submit">이름 변경</button></form><form method="post" th:action="@{/labels/{id}/delete(id=${label.id})}"><button type="submit">라벨 삭제</button></form></article><p class="hint">라벨을 삭제해도 메모는 삭제되지 않습니다.</p></section></main></body></html>
