<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>REA 메모</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/app.js}"></script></head><body><header><a href="/" class="brand"><span class="logo">▤</span> REA 메모</a><span>나의 생각을 모으는 공간</span></header><main><nav aria-label="메모 분류"><a href="/" th:attr="aria-current=${archiveView ? null : 'page'}">전체 메모</a><a href="/archive" th:attr="aria-current=${archiveView ? 'page' : null}">보관함</a></nav><div class="heading"><div><p class="eyebrow">MY NOTES</p><h1 th:text="${archiveView ? '보관함' : '전체 메모'}"></h1></div><a class="button" href="/notes/new">＋ 새 메모</a></div>
<p class="success" role="status" th:if="${success}" th:text="${success}"></p>
<section class="empty" th:if="${#lists.isEmpty(notes)}"><span>✎</span><h2 th:text="${archiveView ? '보관함이 비어 있습니다' : '첫 번째 생각을 남겨 보세요'}"></h2><p th:text="${archiveView ? '보관한 메모가 여기에 표시됩니다.' : '아직 저장한 메모가 없습니다. 보관한 메모는 보관함에서 확인하세요.'}"></p><a href="/notes/new">메모 작성하기</a></section>
<section class="cards" aria-label="저장한 메모"><article class="card" th:each="note : ${notes}"><a class="card-link" th:href="@{/notes/{id}(id=${note.id})}"><h2 th:text="${#strings.isEmpty(note.title) ? '제목 없음' : note.title}"></h2><p class="body" th:text="${note.body}"></p><small th:text="${#temporals.format(note.updatedAt, 'yyyy-MM-dd HH:mm')} + ' UTC 수정'"></small></a><form method="post" th:action="@{/notes/{id}/{action}(id=${note.id},action=${archiveView ? 'unarchive' : 'archive'})}"><button type="submit" th:text="${archiveView ? '보관 해제' : '보관'}" th:attr="aria-label=${(archiveView ? '보관 해제: ' : '보관: ') + note.title}"></button><span class="hint" data-submit-state aria-live="polite"></span></form></article></section>
<footer>카드 목록과 편집창을 참고한 과제 구현 · 원본과 UI 동일성 미검증</footer></main></body></html>
