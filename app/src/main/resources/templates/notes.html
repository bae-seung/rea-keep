<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>REA 메모</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/app.js}"></script></head><body><header><a href="/" class="brand"><span class="logo">▤</span> REA 메모</a><span>나의 생각을 모으는 공간</span></header><main><div class="heading"><div><p class="eyebrow">MY NOTES</p><h1>메모</h1></div><a class="button" href="/notes/new">＋ 새 메모</a></div>
<p class="success" role="status" th:if="${success}" th:text="${success}"></p>
<section class="empty" th:if="${#lists.isEmpty(notes)}"><span>✎</span><h2>첫 번째 생각을 남겨 보세요</h2><p>아직 저장한 메모가 없습니다.</p><a href="/notes/new">메모 작성하기</a></section>
<section class="cards" aria-label="저장한 메모"><a class="card" th:each="note : ${notes}" th:href="@{/notes/{id}(id=${note.id})}"><h2 th:text="${#strings.isEmpty(note.title) ? '제목 없음' : note.title}"></h2><p class="body" th:text="${note.body}"></p><small th:text="${#temporals.format(note.updatedAt, 'yyyy-MM-dd HH:mm')} + ' UTC 수정'"></small></a></section>
<footer>카드 목록과 편집창을 참고한 과제 구현 · 원본과 UI 동일성 미검증</footer></main></body></html>
