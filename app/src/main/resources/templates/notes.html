<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>REA 메모</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/app.js}"></script></head><body><header><a href="/" class="brand"><span class="logo">▤</span> REA 메모</a><span>나의 생각을 모으는 공간</span></header><main th:with="isTrash=${page == 'trash'},isSearch=${page == 'search'}">
<nav aria-label="메모 분류"><a href="/">전체 메모</a><a href="/archive">보관함</a><a href="/trash">휴지통</a><a href="/labels">라벨 관리</a></nav>
<form method="get" action="/search" class="search"><label for="q">제목·본문 검색 (보관함 포함)</label><input id="q" name="q" maxlength="200" th:value="${q}" placeholder="검색어 입력"><button type="submit">검색</button></form>
<p th:if="${labelName}" th:text="'라벨: ' + ${labelName}"></p><div class="heading"><h1 th:text="${isTrash ? '휴지통' : (isSearch ? '검색 결과' : (archiveView ? '보관함' : '전체 메모'))}"></h1><a class="button" href="/notes/new">＋ 새 메모</a></div>
<p th:if="${isTrash}" class="hint">자동 삭제하지 않습니다. 복원하면 삭제 전 위치로 돌아갑니다.</p>
<p class="success" role="status" th:if="${success}" th:text="${success}"></p>
<section class="empty" th:if="${#lists.isEmpty(notes)}"><h2 th:text="${isTrash ? '휴지통이 비어 있습니다' : (isSearch ? '검색 결과가 없습니다' : (archiveView ? '보관함이 비어 있습니다' : '아직 저장한 메모가 없습니다'))}"></h2><p th:if="${isSearch}">제목 또는 본문의 다른 검색어를 입력해 주세요.</p></section>
<section class="cards" aria-label="메모 목록"><article class="card" th:each="note : ${notes}" th:classappend="${'color-' + note.color}"><span class="pin" th:if="${note.pinned}">● 고정됨</span>
<a th:if="${!isTrash}" class="card-link" th:href="@{/notes/{id}(id=${note.id})}"><h2 th:text="${#strings.isEmpty(note.title) ? '제목 없음' : note.title}"></h2><p class="body" th:text="${note.body}"></p></a>
<div th:if="${isTrash}"><h2 th:text="${#strings.isEmpty(note.title) ? '제목 없음' : note.title}"></h2><p class="body" th:text="${note.body}"></p></div>
<ul class="checklist"><li th:each="item : ${note.items}" th:classappend="${item.done ? 'done' : ''}" th:text="${(item.done ? '☑ ' : '☐ ') + item.text}"></li></ul>
<div class="label-chips"><a th:each="label : ${note.labels}" th:href="@{/labels/{id}(id=${label.id})}" th:text="${label.name}"></a></div><small th:text="${#temporals.format(note.updatedAt, 'yyyy-MM-dd HH:mm')} + ' UTC 수정'"></small>
<p class="hint" th:if="${note.archived}">보관된 메모</p>
<div th:if="${!isTrash}"><form method="post" th:action="@{/notes/{id}/pin(id=${note.id})}"><input type="hidden" name="pinned" th:value="${!note.pinned}"><button type="submit" th:text="${note.pinned ? '고정 해제' : '고정'}"></button></form><form method="post" th:action="@{/notes/{id}/{action}(id=${note.id},action=${note.archived ? 'unarchive' : 'archive'})}"><button type="submit" th:text="${note.archived ? '보관 해제' : '보관'}"></button></form>
<form method="post" th:action="@{/notes/{id}/trash(id=${note.id})}"><button type="submit">휴지통으로 이동</button></form></div>
<div th:if="${isTrash}"><form method="post" th:action="@{/notes/{id}/restore(id=${note.id})}"><button type="submit">복원</button></form><a th:href="@{/notes/{id}/delete-confirm(id=${note.id})}">영구 삭제…</a></div>
</article></section><footer>과제 구현 · 원본과 UI 동일성 미검증</footer></main></body></html>
