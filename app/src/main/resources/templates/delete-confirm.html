<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>REA 메모</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/app.js}"></script></head><body><header><a href="/" class="brand"><span class="logo">▤</span> REA 메모</a><span>나의 생각을 모으는 공간</span></header><main><section class="editor" role="alertdialog" aria-labelledby="confirm-title" aria-describedby="confirm-description"><h1 id="confirm-title">메모를 영구 삭제할까요?</h1><p id="confirm-description">삭제하면 복원할 수 없습니다.</p><h2 th:text="${note.title}"></h2><p class="body" th:text="${note.body}"></p><form method="post" th:action="@{/notes/{id}/delete(id=${note.id})}"><label><input type="checkbox" name="confirmed" value="true" required> 영구 삭제에 동의합니다</label><div class="actions"><a href="/trash">취소</a><button type="submit">영구 삭제</button></div></form></section></main></body></html>
